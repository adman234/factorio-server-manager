name: Release bundles

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  add-assets-to-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          go-version: stable
          cache-dependency-path: src/go.sum
      - name: Create release bundles
        run: make gen_release
      - name: Upload release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/factorio-server-manager-windows.zip "factorio-server-manager-windows-$TAG.zip"
          cp build/factorio-server-manager-linux.zip "factorio-server-manager-linux-$TAG.zip"
          gh release upload "$TAG" --clobber \
            "factorio-server-manager-windows-$TAG.zip" \
            "factorio-server-manager-linux-$TAG.zip"
  # Docker publish for releases is handled by ghcr-publish.yml instead
  # (pushes to ghcr.io using the built-in GITHUB_TOKEN, no Docker Hub
  # secrets required, which this fork doesn't have).
