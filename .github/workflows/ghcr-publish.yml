name: Build and publish to GHCR

on:
  push:
    branches: [develop]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build release bundle
        run: make build

      - name: Copy bundle into docker build context
        run: cp build/factorio-server-manager-linux.zip docker/factorio-server-manager-linux.zip

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/fsm
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAGS="$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="$TAGS,$IMAGE:${{ github.event.release.tag_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./docker/
          file: ./docker/Dockerfile-local
          push: true
          tags: ${{ steps.tags.outputs.tags }}
