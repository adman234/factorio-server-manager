name: Build and publish to GHCR

on:
  push:
    branches: [develop]
  # Build and smoke test the image on pull requests (including Renovate's), without publishing.
  pull_request:
  release:
    types: [published]
  # Weekly rebuild so :latest picks up security fixes in the ubuntu base image.
  schedule:
    - cron: '45 5 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build into the local Docker daemon first and start it, so a broken
      # image is never published as :latest.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: fsm:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (web UI answers, health check passes, docker stop exits cleanly)
        run: |
          docker run -d --name fsm -p 8080:80 fsm:test
          # The entrypoint downloads the Factorio headless server first, so allow a few minutes
          for i in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' fsm)
            if [ "$health" = "healthy" ] && curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "web UI is up and the container is healthy"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' fsm)" != "true" ]; then
              echo "container exited"; docker logs fsm; exit 1
            fi
            if [ "$i" = 60 ]; then
              echo "container was not healthy within 5 minutes"; docker logs fsm; exit 1
            fi
            sleep 5
          done
          docker stop -t 60 fsm
          code=$(docker inspect -f '{{.State.ExitCode}}' fsm)
          docker logs fsm | tail -20
          if [ "$code" != 0 ]; then
            echo "container exited with $code after docker stop"; exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        if: github.event_name != 'pull_request'
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/fsm
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAGS="$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="$TAGS,$IMAGE:$RELEASE_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # Same build again; every layer comes from the builder's cache, so this only pushes.
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
